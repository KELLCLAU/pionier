<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Ayuda TI · Gerencia · Pionier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--ink:#1f2430;--muted:#6b7280;--yellow:#F5C400;--navy:#26324f;--green:#16a34a;--blue:#2563eb;--red:#ef4444;--purple:#7c5cbf;--orange:#ea580c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
.brandbar{background:#0f0f0f;padding:10px 30px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--yellow)}
.brandbar .logo{background:var(--yellow);color:#111;font-weight:900;font-size:14px;padding:5px 6px 5px 10px;border-radius:5px}
.brandbar .logo .b{background:#111;color:var(--yellow);padding:3px 7px;border-radius:3px;margin-left:3px}
.brandbar .app{color:#eaeaea;font-size:12px;font-weight:600;letter-spacing:.5px}
.wrap{padding:24px 30px;max-width:1480px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.title{font-size:28px;font-weight:800;margin:3px 0 4px}
.subtitle{font-size:13px;color:var(--muted)}
.corte{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--muted);white-space:nowrap}
.corte b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:15px 16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:30px;font-weight:900;margin:6px 0 2px;line-height:1}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi.g{border-top-color:var(--green)}.kpi.g .v{color:var(--green)}
.kpi.b{border-top-color:var(--blue)}.kpi.b .v{color:var(--blue)}
.kpi.y{border-top-color:var(--yellow)}.kpi.y .v{color:#b8860b}
.kpi.r{border-top-color:var(--red)}.kpi.r .v{color:var(--red)}
.kpi.dark{background:#111;border-top-color:var(--yellow)}.kpi.dark .l,.kpi.dark .s{color:#c8c6c4}.kpi.dark .v{color:var(--yellow)}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:1.5fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800}
.card .hint{font-size:11px;color:var(--muted);margin-bottom:16px}
.chart-box{position:relative;height:240px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.bar-row .bl{width:180px;min-width:180px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{flex:1;height:14px;background:#eef0f3;border-radius:7px;overflow:hidden}
.bar-row .bf{height:100%;border-radius:7px}
.bar-row .bv{width:44px;text-align:right;font-weight:800;font-size:13px}
.signal{border-left:6px solid var(--green)}
.signal .badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:800;color:#fff;margin-bottom:12px}
.signal ul{margin:0;padding-left:18px;line-height:1.9;font-size:13px}
.signal ul b{color:var(--ink)}
.state{background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:1fr 1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 30%,#1a1a1a,#0a0a0a);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.55);text-align:center}
.login .logo{background:var(--yellow);color:#111;font-weight:900;font-size:14px;padding:5px 6px 5px 10px;border-radius:5px}
.login .logo .b{background:#111;color:var(--yellow);padding:3px 6px;border-radius:3px;margin-left:3px}
.login h2{margin:14px 0 3px;font-size:20px;color:#111}
.login p{margin:0 0 22px;font-size:12px;color:#6b7280}
.login input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px;outline:none}
.login button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login .err{color:#dc2626;font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <div style="font-size:18px"><span class="logo">GRUPO<span class="b">PIONIER</span></span></div>
    <h2>Mesa de Ayuda · TI</h2><p>Reporte Gerencial</p>
    <input type="password" id="pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Iniciar Sesión</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div class="brandbar"><span class="logo">GRUPO<span class="b">PIONIER</span></span><span class="app">Mesa de Ayuda TI · Gerencia General</span></div>
<div class="wrap" id="app"><div class="state">⏳ Cargando datos…</div></div>

<script>
const DASH_PASS='pioner2026';
let D=null, charts={};
const fmt=n=>(n==null?0:n).toLocaleString('es-PE');

async function cargar(){
  try{
    const r=await fetch('helpdesk.json?_='+Date.now());
    if(!r.ok) throw new Error('No se encontró helpdesk.json');
    D=await r.json(); render();
  }catch(e){ document.getElementById('app').innerHTML='<div class="state">⚠️ '+(e.message||e)+'<br><small>Sube el archivo helpdesk.json junto a esta página.</small></div>'; }
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cap(s){return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function barRow(label,val,max,color){var w=max>0?(val/max*100):0;return '<div class="bar-row"><div class="bl" title="'+esc(label)+'">'+esc(label)+'</div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+color+'"></div></div><div class="bv">'+fmt(val)+'</div></div>';}

function render(){
  const k=(D.rs1_kpis&&D.rs1_kpis[0])||{};
  const areas=(D.rs2_area||[]).slice().sort((a,b)=>b.TotalTickets-a.TotalTickets);
  const prio=(D.rs3_prioridad||[]);
  const resp=(D.rs4_responsable||[]).slice().sort((a,b)=>b.TotalTickets-a.TotalTickets);
  const tend=(D.rs5_tendencia||[]);
  const soli=(D.rs6_solicitantes||[]).slice().sort((a,b)=>b.TotalTickets-a.TotalTickets);

  const total=k.TotalTickets||0, cerr=k.Cerrados||0;
  const pctRes=total?Math.round(cerr/total*100):0;
  const conf=k.PctConConformidad||0;
  const punt=k.PromPuntajeColaborador||0;

  // señal
  const topArea=areas[0], topResp=resp[0];
  let sig=pctRes>=90?{t:'Servicio saludable',c:'#16a34a'}:(pctRes>=80?{t:'Servicio estable',c:'#d4a017'}:{t:'Requiere atención',c:'#ef4444'});
  const señal=[];
  señal.push('De <b>'+fmt(total)+'</b> tickets, <b>'+fmt(cerr)+'</b> resueltos (<b>'+pctRes+'%</b> de resolución) con <b>'+conf.toFixed(0)+'%</b> de conformidad.');
  if(topArea) señal.push('La mayor carga la atiende <b>'+cap(topArea.NO_AREA)+'</b> con <b>'+fmt(topArea.TotalTickets)+'</b> tickets.');
  if(topResp) señal.push('El colaborador con más tickets es <b>'+cap(topResp.NO_USR_RESPONSABLE)+'</b> ('+fmt(topResp.TotalTickets)+').');
  señal.push('Puntaje promedio de servicio: <b>'+punt.toFixed(0)+'/300</b> · tiempo medio de resolución <b>'+(k.PromHorasResolucion||0).toFixed(1)+' h</b>.');

  const maxA=Math.max.apply(null,areas.map(a=>a.TotalTickets).concat([1]));
  const maxR=Math.max.apply(null,resp.map(a=>a.TotalTickets).concat([1]));
  const maxS=Math.max.apply(null,soli.map(a=>a.TotalTickets).concat([1]));

  document.getElementById('app').innerHTML=
    '<div class="head"><div>'
      +'<div class="eyebrow">Pionier · Área de TI</div>'
      +'<div class="title">Reporte Gerencial de Mesa de Ayuda</div>'
      +'<div class="subtitle">Volumen, resolución, carga del equipo y conformidad del servicio de tickets</div>'
      +'</div><div class="corte">Corte de información · <b>'+esc(D.generado||'')+'</b></div></div>'

    +'<div class="kpis">'
      +'<div class="kpi dark"><div class="l">Total tickets</div><div class="v">'+fmt(total)+'</div><div class="s">acumulado</div></div>'
      +'<div class="kpi g"><div class="l">Resueltos</div><div class="v">'+pctRes+'%</div><div class="s">'+fmt(cerr)+' cerrados</div></div>'
      +'<div class="kpi b"><div class="l">Conformidad</div><div class="v">'+conf.toFixed(0)+'%</div><div class="s">'+fmt(k.CerradosSatisfactoriamente)+' satisf.</div></div>'
      +'<div class="kpi y"><div class="l">Puntaje servicio</div><div class="v">'+punt.toFixed(0)+'</div><div class="s">de 300</div></div>'
      +'<div class="kpi"><div class="l">Abiertos</div><div class="v">'+fmt(k.Abiertos)+'</div><div class="s">en atención</div></div>'
      +'<div class="kpi r"><div class="l">Críticos</div><div class="v">'+fmt(k.Criticos)+'</div><div class="s">prioridad alta</div></div>'
    +'</div>'

    +'<div class="grid g2">'
      +'<div class="card"><h3>Tendencia mensual</h3><div class="hint">Tickets creados vs. cerrados por mes.</div><div class="chart-box"><canvas id="chTend"></canvas></div></div>'
      +'<div class="card"><h3>Tickets por prioridad</h3><div class="hint">Distribución del volumen.</div><div class="chart-box"><canvas id="chPrio"></canvas></div></div>'
    +'</div>'

    +'<div class="grid g2">'
      +'<div class="card"><h3>Quién atiende más tickets</h3><div class="hint">Carga por responsable (top 8).</div>'
        +resp.slice(0,8).map(function(r){return barRow(cap(r.NO_USR_RESPONSABLE)+' · '+cap(r.NO_AREA||''),r.TotalTickets,maxR,'#26324f');}).join('')+'</div>'
      +'<div class="card"><h3>Áreas que más solicitan</h3><div class="hint">Tickets por área destino.</div>'
        +areas.map(function(a){return barRow(cap(a.NO_AREA),a.TotalTickets,maxA,'#F5C400');}).join('')+'</div>'
    +'</div>'

    +'<div class="grid g2">'
      +'<div class="card"><h3>Usuarios que más solicitan</h3><div class="hint">Top solicitantes por volumen (top 8).</div>'
        +soli.slice(0,8).map(function(s){return barRow(cap(s.NO_USR_SOLICITANTE)+' · '+cap(s.AREA_DESTINO||''),s.TotalTickets,maxS,'#7c5cbf');}).join('')+'</div>'
      +'<div class="card signal" style="border-left-color:'+sig.c+'"><h3>Señal gerencial</h3><div class="badge" style="background:'+sig.c+'">'+sig.t+'</div><ul>'+señal.map(s=>'<li>'+s+'</li>').join('')+'</ul></div>'
    +'</div>';

  // Tendencia
  if(charts.t)charts.t.destroy();
  charts.t=new Chart(document.getElementById('chTend'),{type:'line',
    data:{labels:tend.map(t=>t.MesAnio),datasets:[
      {label:'Creados',data:tend.map(t=>t.Creados),borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.10)',fill:true,tension:.35,borderWidth:2,pointRadius:4,pointBackgroundColor:'#2563eb'},
      {label:'Cerrados',data:tend.map(t=>t.Cerrados),borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.10)',fill:true,tension:.35,borderWidth:2,pointRadius:4,pointBackgroundColor:'#16a34a'}
    ]},
    options:{plugins:{legend:{position:'bottom',labels:{color:'#6b7280',boxWidth:12,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{color:'#6b7280'}},y:{grid:{color:'#eef0f3'},ticks:{color:'#6b7280',precision:0}}}}});
  // Prioridad
  if(charts.p)charts.p.destroy();
  var pc={'Crítica':'#ef4444','Alta':'#ea580c','Media':'#d4a017','Baja':'#16a34a'};
  charts.p=new Chart(document.getElementById('chPrio'),{type:'doughnut',
    data:{labels:prio.map(p=>p.NO_PRIORITY),datasets:[{data:prio.map(p=>p.TotalTickets),backgroundColor:prio.map(p=>pc[p.NO_PRIORITY]||'#9aa0a6'),borderWidth:2,borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom',labels:{color:'#6b7280',boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>{var t=c.dataset.data.reduce((a,b)=>a+b,0)||1;return ' '+c.label+': '+fmt(c.raw)+' ('+Math.round(c.raw/t*100)+'%)';}}}},cutout:'60%'}});
}

function doLogin(){ if(document.getElementById('pass').value===DASH_PASS){try{sessionStorage.setItem('hd_auth','1');}catch(e){}entrar();}else{document.getElementById('loginErr').textContent='Contraseña incorrecta';document.getElementById('pass').value='';} }
function entrar(){document.getElementById('login').style.display='none';cargar();}
(function(){var ok=false;try{ok=sessionStorage.getItem('hd_auth')==='1';}catch(e){}if(ok)entrar();else setTimeout(function(){var p=document.getElementById('pass');if(p)p.focus();},100);})();
</script>
</body>
</html>
