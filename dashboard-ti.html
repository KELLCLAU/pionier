<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Integral de TI · Gerencia · Pionier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--ink:#1f2430;--muted:#6b7280;--yellow:#F5C400;--navy:#26324f;--green:#16a34a;--blue:#2563eb;--red:#ef4444;--purple:#7c5cbf;--orange:#ea580c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
.brandbar{background:#0f0f0f;padding:10px 30px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--yellow)}
.brandbar .logo{background:var(--yellow);color:#111;font-weight:900;font-size:14px;padding:5px 6px 5px 10px;border-radius:5px}
.brandbar .logo .b{background:#111;color:var(--yellow);padding:3px 7px;border-radius:3px;margin-left:3px}
.brandbar .app{color:#eaeaea;font-size:12px;font-weight:600;letter-spacing:.5px}
.wrap{padding:24px 30px;max-width:1480px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.title{font-size:28px;font-weight:800;margin:3px 0 4px}
.subtitle{font-size:13px;color:var(--muted)}
.corte{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--muted);white-space:nowrap}
.corte b{color:var(--ink)}
.zone{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:1px;margin:8px 2px 12px;display:flex;align-items:center;gap:8px}
.zone::before{content:'';width:5px;height:16px;background:var(--yellow);border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:15px 16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.kpi .l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:29px;font-weight:900;margin:6px 0 2px;line-height:1}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi.g .v{color:var(--green)}.kpi.g{border-top-color:var(--green)}
.kpi.b .v{color:var(--blue)}.kpi.b{border-top-color:var(--blue)}
.kpi.y .v{color:#b8860b}.kpi.y{border-top-color:var(--yellow)}
.kpi.p .v{color:var(--purple)}.kpi.p{border-top-color:var(--purple)}
.kpi.dark{background:#111;border-top-color:var(--yellow)}.kpi.dark .l,.kpi.dark .s{color:#c8c6c4}.kpi.dark .v{color:var(--yellow)}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800}
.card .hint{font-size:11px;color:var(--muted);margin-bottom:16px}
.chart-box{position:relative;height:230px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar-row .bl{width:175px;min-width:175px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{flex:1;height:13px;background:#eef0f3;border-radius:7px;overflow:hidden}
.bar-row .bf{height:100%;border-radius:7px}
.bar-row .bv{width:42px;text-align:right;font-weight:800;font-size:13px}
.signal{border-left:6px solid var(--green)}
.signal .badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:800;color:#fff;margin-bottom:12px}
.signal ul{margin:0;padding-left:18px;line-height:1.9;font-size:13px}
.signal ul b{color:var(--ink)}
.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:20px;flex-wrap:wrap;align-items:end;margin-bottom:18px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.filters label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}
.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fdfdfb;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer;outline:none;min-width:170px}
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff}
.ctab th.c,.ctab td.c{text-align:center}
.ctab td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tg{font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px}
.scroller{max-height:300px;overflow-y:auto;padding-right:4px}
.bar-row.clk{cursor:pointer;border-radius:6px;padding:3px 5px;margin-left:-5px}
.bar-row.clk:hover{background:#f5f6f8}
.bar-row.mute .bf{background:#c9d2dc !important}
.bar-row .bl .uni{display:block;font-size:9.5px;color:#b08900;font-weight:600;letter-spacing:.2px}
.bar-row .bv .pc{display:block;font-size:9.5px;color:var(--muted);font-weight:600;margin-top:-1px}
.card.compacta .bar-row{margin-bottom:7px}
.card.compacta .bar-row .bl{width:150px;min-width:150px;line-height:1.15}
.card.compacta .bar-row .bt{height:11px}
.card.compacta .bar-row .bv{width:52px;font-size:12px;line-height:1.15}
.card.compacta .scroller{max-height:none;overflow:visible}
.mini-area{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:6px}
.mini-area .n{width:140px;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-area .t{flex:1;height:9px;background:#eef0f3;border-radius:5px;overflow:hidden}
.mini-area .f{height:100%;background:var(--yellow);border-radius:5px}
.mini-area .v{width:64px;text-align:right;color:var(--muted);font-size:11px}
.bloq{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 9px}
.tr-clk{cursor:pointer}
.tr-clk:hover td{background:#f6f7f9}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:30px 16px;overflow:auto}
.ov.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:840px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{background:#111;border-bottom:3px solid var(--yellow);padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-h .t{color:#fff;font-size:16px;font-weight:700}
.modal-h .s{color:#c8c6c4;font-size:11px;margin-top:3px}
.modal-h .x{background:none;border:none;color:var(--yellow);font-size:22px;cursor:pointer;line-height:1}
.modal-b{padding:18px 20px;max-height:70vh;overflow:auto}
.state{background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:1fr 1fr 1fr}.g2{grid-template-columns:1fr}}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 30%,#1a1a1a,#0a0a0a);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.55);text-align:center}
.login .logo{background:var(--yellow);color:#111;font-weight:900;font-size:14px;padding:5px 6px 5px 10px;border-radius:5px}
.login .logo .b{background:#111;color:var(--yellow);padding:3px 6px;border-radius:3px;margin-left:3px}
.login h2{margin:14px 0 3px;font-size:20px;color:#111}.login p{margin:0 0 22px;font-size:12px;color:#6b7280}
.login input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px;outline:none}
.login button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login .err{color:#dc2626;font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <div style="font-size:18px"><span class="logo">GRUPO<span class="b">PIONIER</span></span></div>
    <h2>Panel Integral de TI</h2><p>Gerencia General</p>
    <input type="password" id="pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Iniciar Sesión</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div class="brandbar"><span class="logo">GRUPO<span class="b">PIONIER</span></span><span class="app">Panel Integral de TI · Proyectos + Mesa de Ayuda</span></div>
<div class="wrap" id="app"><div class="state">⏳ Cargando datos…</div></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeProj()"><div class="modal" id="modal"></div></div>

<script>
const SB_URL='https://jsmryefxbjyxviopesgt.supabase.co';
const SB_KEY='sb_publishable_1sxgjIf_jVz30FKBPjpMrQ_c8T0hyEu';
const SB_ID='keiko_pionier';
const DASH_PASS='pioner2026';
const MEMBERS=['CS','KB','OM','KP','OR','CL','MH','JH','LP','ST','CG','CB','CA','RT','JS','WR','ME','AC','DG','CH','MG','KA'];
const MEMBER_NAMES=['Carlos Salas','Kelly Barrientos','Omar Muñoz','Keiko Palomino','Owen Rojas','Claudia López','Miguel Hernández','Jaime Halire','Luis Palomino','Saúl Tapia','Cleison Guevara','Claudio Barahona','Carla Arce','Rigoberto Timaná','Jean Sánchez','Wilder Rojas','Mauro Elías','Antony Chilquillo','Daniel Guerrero','Cristian Huaman','Maria Gracia La Torre','Karla Aguilar'];
function mName(c){if(!c)return 'Sin asignar';var i=MEMBERS.indexOf(c);return i>=0?MEMBER_NAMES[i]:c;}
function barRowClk(label,val,max,color,onclick,suf){var w=max>0?(val/max*100):0;return '<div class="bar-row clk" onclick="'+onclick+'"><div class="bl" title="'+esc(label)+'">'+esc(label)+'</div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+color+'"></div></div><div class="bv">'+val+(suf||'')+'</div></div>';}
function openProj(pid){
  var p=(ST.projects||[]).find(function(x){return x.id===pid;}); if(!p) return;
  var ts=(ST.tickets||[]).filter(function(t){return t.projId===pid;});
  var ec=p.empresa==='MODIPSA'?'#2563eb':'#16a34a';
  var byCol=['Backlog','En progreso','En revisión','Hecho'].map(function(c){return c+': '+ts.filter(function(t){return t.col===c;}).length;}).join('  ·  ');
  var rows=ts.map(function(t){
    var cc={'Backlog':'#8a8886','En progreso':'#0ea5e9','En revisión':'#8b5cf6','Hecho':'#16a34a'}[t.col]||'#8a8886';
    return '<tr><td style="font-weight:600">'+esc(t.title||'—')+'</td><td>'+esc(mName(t.assignee||t.responsable))+'</td><td class="c"><span class="tg" style="background:'+cc+'22;color:'+cc+'">'+esc(t.col||'—')+'</span></td><td class="c">'+esc(t.prioridad||'Media')+'</td></tr>';
  }).join('');
  document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+esc(p.name)+'</div><div class="s"><span class="tg" style="background:'+ec+';color:#fff">'+esc(p.empresa||'')+'</span> · '+progress(pid)+'% completado · '+ts.length+' tareas'+(p.area?' · '+esc(p.area):'')+'</div></div><button class="x" onclick="closeProj()">✕</button></div>'
    +'<div class="modal-b"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">'+byCol+'</div>'
    +'<table class="ctab"><thead><tr><th>Tarea</th><th>Quién lo realiza</th><th class="c">Estado</th><th class="c">Prioridad</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">Sin tareas registradas</td></tr>')+'</tbody></table></div>';
  document.getElementById('ov').classList.add('show');
}
function closeProj(){document.getElementById('ov').classList.remove('show');}
function openResp(nombre){
  var lista=((HD&&HD.tickets)||[]).filter(function(t){return (t.responsable||'').toUpperCase()===(nombre||'').toUpperCase();});
  var body;
  if(!(HD&&HD.tickets)){
    body='<div style="color:var(--muted);padding:10px 0;font-size:13px">El detalle de tickets aún no está cargado.<br>Corre el script <b>helpdesk_export.py</b> para traerlo y súbelo con el dashboard.</div>';
  } else if(!lista.length){
    body='<div style="color:var(--muted);padding:10px 0">Sin tickets registrados para este colaborador.</div>';
  } else {
    lista.sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
    var rows=lista.map(function(t){
      var ce={'Cerrado':'#16a34a','Cerrado ✓':'#16a34a','Nuevo':'#8a8886','Asignado':'#0ea5e9','En proceso':'#0ea5e9','Rechazado':'#ef4444','Cancelado':'#8a8886','Reabierto':'#ea580c'}[t.estado]||'#6b7280';
      return '<tr><td style="white-space:nowrap;font-weight:600">'+esc(t.ticket)+'</td><td style="white-space:normal">'+esc(t.titulo||'—')+'</td><td class="c">'+esc(t.area||'—')+'</td><td class="c"><span class="tg" style="background:'+ce+'22;color:'+ce+'">'+esc(t.estado||'—')+'</span></td><td class="c">'+esc(t.prioridad||'—')+'</td><td class="c" style="white-space:nowrap">'+esc(t.fecha||'')+'</td></tr>';
    }).join('');
    body='<table class="ctab"><thead><tr><th>Ticket</th><th>Título</th><th class="c">Área</th><th class="c">Estado</th><th class="c">Prioridad</th><th class="c">Fecha</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+esc(cap(nombre))+'</div><div class="s">'+lista.length+' ticket'+(lista.length===1?'':'s')+' atendidos</div></div><button class="x" onclick="closeProj()">✕</button></div><div class="modal-b">'+body+'</div>';
  document.getElementById('ov').classList.add('show');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeProj();});
var SM_INCLUIR_DESCARTADOS=false;
function openSubtipo(sub){
  var base=((HD&&HD.tickets)||[]).filter(function(t){
    return SM_INCLUIR_DESCARTADOS || ['Cancelado','Rechazado'].indexOf(t.estado)<0;
  });
  var lista, titulo;
  if(sub==='__OTROS__'){
    var m={}; base.forEach(function(t){var s=normSubtipo(t.subtipo);m[s]=(m[s]||0)+1;});
    var orden=Object.keys(m).sort(function(a,b){return m[b]-m[a];}).slice(8);
    lista=base.filter(function(t){return orden.indexOf(normSubtipo(t.subtipo))>=0;});
    titulo='Otros tipos de requerimiento';
  } else {
    lista=base.filter(function(t){return normSubtipo(t.subtipo)===sub;});
    titulo=sub;
  }
  lista.sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});

  var content;
  if(!lista.length){
    content='<div style="color:var(--muted);padding:10px 0">Sin tickets.</div>';
  } else {
    /* distribución por área — el subtipo solo tiene sentido dentro de su área */
    var pa={}; lista.forEach(function(t){var a=cap(t.area||'Sin área');pa[a]=(pa[a]||0)+1;});
    var areas=Object.keys(pa).map(function(k){return{a:k,n:pa[k]};}).sort(function(x,y){return y.n-x.n;});
    var mxa=areas[0].n;
    var blocA='<p class="bloq">Distribución por área</p>'+areas.map(function(x){
      return '<div class="mini-area"><span class="n" title="'+esc(x.a)+'">'+esc(x.a)+'</span>'
        +'<span class="t"><span class="f" style="width:'+(x.n/mxa*100)+'%"></span></span>'
        +'<span class="v">'+x.n+' · '+Math.round(x.n/lista.length*100)+'%</span></div>';
    }).join('');

    var rows=lista.map(function(t){
      var ce={'Cerrado':'#16a34a','Nuevo':'#8a8886','Asignado':'#0ea5e9','En desarrollo':'#0ea5e9','En proceso':'#0ea5e9','Pendiente Aprobación':'#7c5cbf','Aprobado':'#7c5cbf','Rechazado':'#ef4444','Cancelado':'#8a8886','Pausado':'#8a8886','Reabierto':'#ea580c'}[t.estado]||'#6b7280';
      return '<tr><td style="white-space:nowrap;font-weight:600">'+esc(t.ticket)+'</td>'
        +'<td style="white-space:normal">'+esc(t.titulo||'—')+'</td>'
        +'<td>'+esc(cap(t.area||'—'))+'</td>'
        +'<td>'+esc(t.solicitante||'—')+'</td>'
        +'<td class="c"><span class="tg" style="background:'+ce+'22;color:'+ce+'">'+esc(t.estado||'—')+'</span></td>'
        +'<td class="c" style="white-space:nowrap">'+esc(t.fecha||'')+'</td></tr>';
    }).join('');
    content=blocA
      +'<p class="bloq" style="margin-top:20px">Tickets</p>'
      +'<table class="ctab"><thead><tr><th>Ticket</th><th>Título</th><th>Área</th><th>Solicitante</th><th class="c">Estado</th><th class="c">Fecha</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  var abiertos=lista.filter(function(t){return ['Cerrado','Rechazado','Cancelado'].indexOf(t.estado)<0;}).length;
  var proy=(window.SM_SEM&&lista.length)?' · a este ritmo, ~'+fmt(Math.round(lista.length/window.SM_SEM*52))+' al año':'';
  document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+esc(titulo)+'</div><div class="s">'+lista.length+' ticket'+(lista.length===1?'':'s')+' · '+abiertos+' sin cerrar'+proy+'</div></div><button class="x" onclick="closeProj()">✕</button></div><div class="modal-b">'+content+'</div>';
  document.getElementById('ov').classList.add('show');
}
function openPersonaProy(cod){
  var nombre=mName(cod);
  var pn={}; (ST.projects||[]).forEach(function(p){pn[p.id]=p.name;});
  var ts=(ST.tickets||[]).filter(function(t){return (t.assignee||t.responsable)===cod;});
  var content;
  if(!ts.length){ content='<div style="color:var(--muted);padding:10px 0">Sin tareas registradas.</div>'; }
  else{
    var rows=ts.map(function(t){var cc={'Backlog':'#8a8886','En progreso':'#0ea5e9','En revisión':'#8b5cf6','Hecho':'#16a34a'}[t.col]||'#8a8886';return '<tr><td style="white-space:normal;font-weight:600">'+esc(t.title||'—')+'</td><td>'+esc(pn[t.projId]||'—')+'</td><td class="c"><span class="tg" style="background:'+cc+'22;color:'+cc+'">'+esc(t.col||'—')+'</span></td></tr>';}).join('');
    content='<table class="ctab"><thead><tr><th>Tarea</th><th>Proyecto</th><th class="c">Estado</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+esc(nombre)+'</div><div class="s">'+ts.length+' tarea'+(ts.length===1?'':'s')+' en proyectos</div></div><button class="x" onclick="closeProj()">✕</button></div><div class="modal-b">'+content+'</div>';
  document.getElementById('ov').classList.add('show');
}
function openLista(cat){
  var ps=projsFiltrados().filter(function(p){return estadoCat(p)===cat;}).sort(function(a,b){return progress(b.id)-progress(a.id);});
  var rows=ps.length?ps.map(function(p){var ec=p.empresa==='MODIPSA'?'#2563eb':'#16a34a';return '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="tg" style="background:'+ec+'22;color:'+ec+'">'+esc(p.empresa||'—')+'</span><span style="flex:1;font-weight:600">'+esc(p.name)+'</span><span style="color:var(--muted);font-size:12px">'+esc(p.area||'')+'</span><span style="font-weight:700;font-size:12px">'+progress(p.id)+'%</span></div>';}).join(''):'<div style="color:var(--muted);padding:12px 0">Sin proyectos.</div>';
  document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+esc(cat)+'</div><div class="s">'+ps.length+' proyecto'+(ps.length===1?'':'s')+'</div></div><button class="x" onclick="closeProj()">✕</button></div><div class="modal-b">'+rows+'</div>';
  document.getElementById('ov').classList.add('show');
}

let ST=null, HD=null, charts={}, fEmp='todas', fEst='todos';
function projsFiltrados(){var q=(ST.projects||[]);if(fEmp!=='todas')q=q.filter(function(p){return p.empresa===fEmp;});if(fEst!=='todos')q=q.filter(function(p){return estadoCat(p)===fEst;});return q;}
function setF(k,v){if(k==='emp')fEmp=v;else fEst=v;render();}
const fmt=n=>(n==null?0:n).toLocaleString('es-PE');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cap=s=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
/* Catálogo canónico: solo une etiquetas que significan lo mismo.
   MEJORA y MEJORA INTERNA NO se unen: en Sistema Activity se usan por igual
   los cuatro meses, falta confirmarlo con el área antes de fusionarlas. */
var CONCEPTO={
  'ACCESOS':'Accesos y permisos',
  'ACCESOS Y PERMISOS':'Accesos y permisos',
  'INCIDENCIAS':'Incidencias',
  'INCONVENIENTES TECNICOS':'Incidencias',
  'CAMBIO VISUAL':'Cambio visual',
  'MEJORA / CAMBIO VISUAL':'Cambio visual'
};
/* Cuántas etiquetas de origen agrupa cada concepto (para la nota bajo la barra) */
var UNIFICA={'Accesos y permisos':2,'Incidencias':2,'Cambio visual':2};
function normSubtipo(s){
  var k=(s||'').toString().trim().toUpperCase();
  if(!k) return 'Sin clasificar';
  return CONCEPTO[k] || cap(k.toLowerCase());
}

// ---- proyectos (Supabase) ----
const projs=()=>ST.projects||[];
const ticketsOf=id=>(ST.tickets||[]).filter(t=>t.projId===id);
function progress(id){const ts=ticketsOf(id);return ts.length?Math.round(ts.filter(t=>t.col==='Hecho').length/ts.length*100):0;}
function enEjec(p){
  if((ST.sprints||[]).some(s=>s.projId===p.id&&s.status==='active'))return true;
  if((ST.tickets||[]).some(t=>t.projId===p.id&&t.col&&t.col!=='Backlog'))return true;
  return p.enEjecucion===true;
}
function estadoCat(p){
  if(progress(p.id)>=100)return 'Completado';
  if(p.estadoReq==='espera_usuario')return 'En espera';
  if(p.estadoReq==='levantamiento')return 'Levantamiento';
  if(enEjec(p))return 'En ejecución';
  return 'Pendiente';
}
function grp(arr,fn){var m={};arr.forEach(function(x){var k=(fn(x)||'').toString().trim()||'Sin definir';m[k]=(m[k]||0)+1;});return Object.keys(m).map(function(k){return{label:k,val:m[k]};}).sort((a,b)=>b.val-a.val);}
function parseD(s){if(!s)return null;var x=String(s);return new Date(x.length<=10?x+'T00:00:00':x);}
function taskDates(t){var sp=t.sprintId?(ST.sprints||[]).find(function(s){return s.id===t.sprintId;}):null;return {start:t.fechaInicio||t.start||t.startDate||(sp&&(sp.start||sp.startDate))||null,end:t.fechaFin||t.end||t.endDate||(sp&&(sp.end||sp.endDate))||null};}

async function cargar(){
  try{
    const [rp,rh]=await Promise.all([
      fetch(SB_URL+'/rest/v1/scrum_state?id=eq.'+SB_ID+'&select=state_json,updated_at',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}),
      fetch('helpdesk.json?_='+Date.now())
    ]);
    const rows=await rp.json();
    ST=(rows[0]&&rows[0].state_json)||{projects:[],tickets:[],sprints:[]};
    HD=rh.ok?await rh.json():null;
    render();
  }catch(e){ document.getElementById('app').innerHTML='<div class="state">⚠️ Error al cargar: '+(e.message||e)+'</div>'; }
}
function barRow(label,val,max,color){var w=max>0?(val/max*100):0;return '<div class="bar-row"><div class="bl" title="'+esc(label)+'">'+esc(label)+'</div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+color+'"></div></div><div class="bv">'+fmt(val)+'</div></div>';}
function donut(id,labels,data,colors){if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom',labels:{color:'#6b7280',boxWidth:12,font:{size:11},padding:8}},tooltip:{callbacks:{label:function(c){var t=c.dataset.data.reduce(function(a,b){return a+b;},0)||1;return ' '+c.label+': '+fmt(c.raw)+' ('+Math.round(c.raw/t*100)+'%)';}}}},cutout:'60%'}});}

      +'<div class="card"><h3>Quién atiende más tickets</h3><div class="hint">Carga por responsable y su área · clic para ver sus tickets.</div><div class="scroller">'+ (resp.length?resp.map(function(r){return barRowClk(cap(r.NO_USR_RESPONSABLE)+' · '+cap(r.NO_AREA||''),r.TotalTickets,maxR,'#26324f',"openResp('"+String(r.NO_USR_RESPONSABLE||'').replace(/'/g,"\\'")+"')");}).join(''):'<div style="color:var(--muted)">Sin datos</div>') +'</div></div>'
      +'<div class="card"><h3>Tickets por área de TI</h3><div class="hint">Carga que atiende cada equipo · desliza para ver todas.</div><div class="scroller">'+ (areasT.length?areasT.map(function(a){return barRow(cap(a.NO_AREA),a.TotalTickets,Math.max.apply(null,areasT.map(function(x){return x.TotalTickets;})),'#0ea5e9');}).join(''):'<div style="color:var(--muted)">Sin datos</div>') +'</div></div>'
    +'</div>';

  var pc={'Crítica':'#ef4444','Alta':'#ea580c','Media':'#d4a017','Baja':'#16a34a'};
}

function doLogin(){ if(document.getElementById('pass').value===DASH_PASS){try{sessionStorage.setItem('ti_auth','1');}catch(e){}entrar();}else{document.getElementById('loginErr').textContent='Contraseña incorrecta';document.getElementById('pass').value='';} }
function entrar(){document.getElementById('login').style.display='none';cargar();}
(function(){var ok=false;try{ok=sessionStorage.getItem('ti_auth')==='1';}catch(e){}if(ok)entrar();else setTimeout(function(){var p=document.getElementById('pass');if(p)p.focus();},100);})();
</script>
