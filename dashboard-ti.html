<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Integral de TI · Gerencia · Pionier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FAF8F2;--card:#FFFFFF;--line:#ECE8DC;--ink:#1C1C1A;--muted:#6E6A60;--soft:#F4F1E7;
  --yellow:#F5C400;--yellow-soft:#FFF6CC;--yellow-ink:#8A6D00;
  --green:#15803D;--green-soft:#E7F5EC;--blue:#1D4ED8;--blue-soft:#E8EEFC;
  --red:#C2410C;--red-soft:#FDEEE6;--violet:#6D4FB3;--violet-soft:#F0ECF9;--grey:#9A968C
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
button{font-family:inherit}

/* ---------- barra de marca ---------- */
.brandbar{background:#fff;border-bottom:4px solid var(--yellow);padding:12px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.logo{display:inline-flex;align-items:center;background:var(--yellow);color:#111;font-weight:900;font-size:13px;letter-spacing:.5px;padding:5px 6px 5px 10px;border-radius:5px}
.logo .b{background:#111;color:var(--yellow);padding:3px 7px;border-radius:3px;margin-left:4px}
.brandbar .app{font-size:13px;font-weight:700;color:var(--ink)}
.brandbar nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.brandbar nav a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
.brandbar nav a:hover{background:var(--yellow-soft);color:var(--ink)}

.wrap{padding:28px 32px 60px;max-width:1360px;margin:0 auto}

/* ---------- avisos ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 16px;font-size:12.5px;margin-bottom:14px;border:1px solid}
.notice.warn{background:var(--yellow-soft);border-color:#F1DE8A;color:#5C4A00}
.notice.err{background:var(--red-soft);border-color:#F6CDB6;color:#7A2A07}
.notice button{margin-left:auto;background:#fff;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

/* ---------- hero ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--yellow)}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:30px;line-height:1.2;font-weight:800;margin:8px 0 10px;max-width:980px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 3px}
.hero .lead{font-size:15px;color:#3F3C35;max-width:960px;margin:0}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
.hero .meta b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.kpi{background:var(--soft);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:32px;font-weight:900;margin:6px 0 4px;line-height:1}
.kpi .v small{font-size:15px;font-weight:700;color:var(--muted)}
.kpi .s{font-size:12px;color:#4A473F}
.kpi.hl{background:var(--yellow-soft)}

/* ---------- capítulos ---------- */
.chapter{margin:38px 0 0;scroll-margin-top:80px}
.ch-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.ch-num{flex:none;width:40px;height:40px;border-radius:10px;background:var(--yellow);color:#111;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.ch-kicker{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.ch-title{font-size:22px;font-weight:800;margin:2px 0 4px;line-height:1.25}
.ch-sub{display:none}
.card .hint{display:none!important}
.ask p{display:none}

.grid{display:grid;gap:16px;margin-bottom:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:800}
.card .hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.chart-box{position:relative;height:250px}

.takeaway{display:flex;gap:10px;align-items:flex-start;background:var(--yellow-soft);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:14px;color:#3F3200}
.takeaway .i{font-weight:900;flex:none}

/* barras */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;border-radius:6px}
.bar-row .bl{width:190px;min-width:190px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{flex:1;height:12px;background:#F0EDE3;border-radius:6px;overflow:hidden}
.bar-row .bf{height:100%;border-radius:6px}
.bar-row .bv{min-width:56px;text-align:right;font-weight:800;font-size:13px}
.bar-row .bv small{font-weight:600;color:var(--muted);font-size:11px}
.bar-row.clk{cursor:pointer;padding:3px 6px;margin-left:-6px}
.bar-row.clk:hover{background:var(--soft)}
.scroller{max-height:310px;overflow-y:auto;padding-right:6px}

/* embudo de estados */
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fstep{border-radius:12px;padding:14px 12px;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.fstep:hover{transform:translateY(-2px);border-color:var(--line)}
.fstep .n{font-size:30px;font-weight:900;line-height:1}
.fstep .t{font-size:12px;font-weight:700;margin-top:6px}
.fstep .d{font-size:11px;color:var(--muted);margin-top:2px}

/* listas de proyectos */
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:var(--soft)}
.pitem .nm{flex:1;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .ar{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mini{width:110px;display:flex;align-items:center;gap:8px}
.mini .t{flex:1;height:7px;background:#F0EDE3;border-radius:4px;overflow:hidden}
.mini .f{height:100%;border-radius:4px}
.mini span{font-size:12px;font-weight:800;min-width:34px;text-align:right}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px;white-space:nowrap}

/* decisiones */
.asks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;border-top:5px solid var(--yellow)}
.ask.red{border-top-color:var(--red)}.ask.violet{border-top-color:var(--violet)}.ask.green{border-top-color:var(--green)}.ask.blue{border-top-color:var(--blue)}
.ask .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.ask h4{margin:6px 0 6px;font-size:15.5px;line-height:1.3}
.ask p{margin:0;font-size:13px;color:#4A473F}
.ask .act{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--soft);border-radius:8px;padding:8px 10px}
.ask .lnk{margin-top:10px;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;display:inline-block}

/* tabla */
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff}
.ctab th.c,.ctab td.c{text-align:center}
.ctab td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tr-clk{cursor:pointer}.tr-clk:hover td{background:var(--soft)}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.filters .lab{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer}
.chip.on{background:var(--yellow);border-color:var(--yellow)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(40,36,25,.35);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow:auto}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:860px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(40,36,25,.25)}
.modal-h{background:var(--yellow-soft);border-bottom:3px solid var(--yellow);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-h .t{font-size:16px;font-weight:800}
.modal-h .s{color:var(--muted);font-size:12px;margin-top:3px}
.modal-h .x{background:#fff;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.modal-b{padding:18px 22px;max-height:70vh;overflow:auto}

.state{background:#fff;border:1px solid var(--line);border-radius:14px;padding:44px;text-align:center;color:var(--muted)}
.foot{margin-top:40px;font-size:11.5px;color:var(--muted);text-align:center}

/* login */
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-top:6px solid var(--yellow);border-radius:14px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(40,36,25,.12);text-align:center}
.login h2{margin:16px 0 3px;font-size:20px}.login p{margin:0 0 22px;font-size:12px;color:var(--muted)}
.login input{width:100%;padding:12px 14px;border:1px solid #D9D4C6;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px;outline:none}
.login input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.login button{width:100%;padding:12px;background:var(--yellow);color:#111;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer}
.login .err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px}

@media(max-width:1050px){.kpis{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(3,1fr)}.brandbar nav{display:none}}
@media(max-width:600px){.wrap{padding:18px 16px 40px}.brandbar{padding:10px 16px}.hero{padding:22px 20px}.hero h1{font-size:23px}.kpis{grid-template-columns:1fr}.funnel{grid-template-columns:1fr 1fr}.bar-row .bl{width:120px;min-width:120px}.pitem .tg:nth-of-type(2){display:none}.mini{width:84px}.asks{grid-template-columns:1fr}}
@media print{.brandbar{position:static}.brandbar nav,.filters,.notice button{display:none}.chapter{break-inside:avoid}}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <span class="logo">GRUPO<span class="b">PIONIER</span></span>
    <h2>Panel Integral de TI</h2><p>Reporte para Gerencia</p>
    <input type="password" id="pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Ingresar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="brandbar">
  <span class="logo">GRUPO<span class="b">PIONIER</span></span>
  <span class="app">Panel Integral de TI</span>
  <nav>
    <a href="#c1">1 · Operación</a><a href="#c2">2 · Demanda</a><a href="#c3">3 · Proyectos</a><a href="#c4">4 · Decisiones</a>
  </nav>
</div>
<div class="wrap" id="app"><div class="state">Cargando datos…</div></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="modal" id="modal"></div></div>

<script>
/* ================= configuración ================= */
const SB_URL='https://jsmryefxbjyxviopesgt.supabase.co';
const SB_KEY='sb_publishable_1sxgjIf_jVz30FKBPjpMrQ_c8T0hyEu';
const SB_ID='keiko_pionier';
const DASH_PASS='pioner2026';
const CACHE_KEY='ti_scrum_cache_v1';
const MEMBERS=['CS','KB','OM','KP','OR','CL','MH','JH','LP','ST','CG','CB','CA','RT','JS','WR','ME','AC','DG','CH','MG','KA'];
const MEMBER_NAMES=['Carlos Salas','Kelly Barrientos','Omar Muñoz','Keiko Palomino','Owen Rojas','Claudia López','Miguel Hernández','Jaime Halire','Luis Palomino','Saúl Tapia','Cleison Guevara','Claudio Barahona','Carla Arce','Rigoberto Timaná','Jean Sánchez','Wilder Rojas','Mauro Elías','Antony Chilquillo','Daniel Guerrero','Cristian Huaman','Maria Gracia La Torre','Karla Aguilar'];
const ECOL={'Completado':'#15803D','En ejecución':'#1D4ED8','Levantamiento':'#B08900','En espera':'#6D4FB3','Pendiente':'#9A968C'};
const ESOFT={'Completado':'#E7F5EC','En ejecución':'#E8EEFC','Levantamiento':'#FFF6CC','En espera':'#F0ECF9','Pendiente':'#F4F1E7'};
const EDESC={'Completado':'entregados al 100%','En ejecución':'con trabajo en curso','Levantamiento':'definiendo alcance','En espera':'esperan al área usuaria','Pendiente':'aún sin iniciar'};
const ESTADOS=['Completado','En ejecución','Levantamiento','En espera','Pendiente'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ================= utilidades ================= */
const fmt=n=>(n==null?0:Math.round(n)).toLocaleString('es-PE');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ACR=/^(ti|rrhh|bd|pos|bi|erp|sku|sla|sap|ux|ui|it|qa)$/i;
const cap=s=>String(s||'').toLowerCase().replace(/(^|[\s·(/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\p{L}+/gu,(w,i)=>ACR.test(w)?w.toUpperCase():(i>0&&/^(de|del|la|las|los|y|e|en|a)$/i.test(w)?w.toLowerCase():w));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const js=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function mName(c){if(!c)return 'Sin asignar';var i=MEMBERS.indexOf(c);return i>=0?MEMBER_NAMES[i]:c;}
function fechaLarga(s){if(!s)return '—';var d=new Date(String(s).length<=10?s+'T00:00:00':s);if(isNaN(d))return esc(s);return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear();}
function diasDesde(s){if(!s)return null;var d=new Date(String(s).length<=10?s+'T00:00:00':s);if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/86400000);}
function parseD(s){if(!s)return null;var x=String(s);var d=new Date(x.length<=10?x+'T00:00:00':x);return isNaN(d)?null:d;}
function grp(arr,fn){var m={};arr.forEach(function(x){var k=(fn(x)||'').toString().trim()||'Sin definir';m[k]=(m[k]||0)+1;});return Object.keys(m).map(function(k){return{label:k,val:m[k]};}).sort((a,b)=>b.val-a.val);}
function bar(label,val,max,color,opts){opts=opts||{};var w=max>0?Math.max(val/max*100,val>0?2:0):0;
  return '<div class="bar-row'+(opts.click?' clk':'')+'"'+(opts.click?' onclick="'+opts.click+'"':'')+'><div class="bl" title="'+esc(label)+'">'+esc(label)+'</div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+color+'"></div></div><div class="bv">'+(opts.txt!=null?opts.txt:fmt(val))+'</div></div>';}
function tag(txt,col,soft){return '<span class="tg" style="background:'+(soft||col+'1f')+';color:'+col+'">'+esc(txt)+'</span>';}
function mini(v,col){return '<div class="mini"><div class="t"><div class="f" style="width:'+v+'%;background:'+col+'"></div></div><span>'+v+'%</span></div>';}
function normSubtipo(s){
  var x=(s||'').toString().toLowerCase().trim();
  if(!x) return 'Sin clasificar';
  if(/impresor/.test(x)) return 'Impresoras';
  if(/soporte software/.test(x)) return 'Soporte de software';
  if(/soporte equipos|pos y lector/.test(x)) return 'Equipos y POS';
  if(/soporte app/.test(x)) return 'Soporte de app y datos';
  if(/acces|permis/.test(x)) return 'Accesos y permisos';
  if(/correo/.test(x)) return 'Correo corporativo';
  if(/red|internet/.test(x)) return 'Red e internet';
  if(/incidencia|inconvenient/.test(x)) return 'Incidencias técnicas';
  if(/desarrollo|\bbd\b|optimizaci|administraci|integraci/.test(x)) return 'Desarrollo / BD';
  if(/mejora|cambio visual/.test(x)) return 'Mejoras / cambios';
  if(/informaci|consulta|reporte/.test(x)) return 'Información / reportes';
  if(/capacita/.test(x)) return 'Capacitación';
  if(/help ?desk/.test(x)) return 'Mesa de ayuda';
  return cap(x);
}

/* ================= estado ================= */
let ST={projects:[],tickets:[],sprints:[]}, HD=null, charts={}, fEmp='todas';
let SRC={proj:'ok',projFecha:null,projErr:'',hd:'ok'};

/* ================= proyectos (SCRUM) ================= */
const ticketsOf=id=>(ST.tickets||[]).filter(t=>t.projId===id);
function progress(id){const ts=ticketsOf(id);return ts.length?Math.round(ts.filter(t=>t.col==='Hecho').length/ts.length*100):0;}
function enEjec(p){
  if((ST.sprints||[]).some(s=>s.projId===p.id&&s.status==='active'))return true;
  if((ST.tickets||[]).some(t=>t.projId===p.id&&t.col&&t.col!=='Backlog'))return true;
  return p.enEjecucion===true;
}
function estadoCat(p){
  if(progress(p.id)>=100)return 'Completado';
  if(p.estadoReq==='espera_usuario')return 'En espera';
  if(p.estadoReq==='levantamiento')return 'Levantamiento';
  if(enEjec(p))return 'En ejecución';
  return 'Pendiente';
}
function taskDates(t){var sp=t.sprintId?(ST.sprints||[]).find(function(s){return s.id===t.sprintId;}):null;return {start:t.fechaInicio||t.start||t.startDate||(sp&&(sp.start||sp.startDate))||null,end:t.fechaFin||t.end||t.endDate||(sp&&(sp.end||sp.endDate))||null};}
function vencidas(pid){var hoy=new Date(new Date().toDateString()).getTime();return ticketsOf(pid).filter(function(t){var d=taskDates(t),e=parseD(d.end);return e&&t.col!=='Hecho'&&e.getTime()<hoy;});}
function projsFiltrados(){var q=(ST.projects||[]);if(fEmp!=='todas')q=q.filter(function(p){return p.empresa===fEmp;});return q;}
function setEmp(v){fEmp=v;render();var c=document.getElementById('c3');if(c)c.scrollIntoView();}
function empTag(e){return e==='MODIPSA'?tag('MODIPSA','#1D4ED8'):(e==='MASISAC'?tag('MASISAC','#15803D'):tag(e||'—','#6E6A60'));}

/* ================= carga con tolerancia a fallos ================= */
function fetchT(url,opt,ms){var c=new AbortController();var t=setTimeout(function(){c.abort();},ms||12000);return fetch(url,Object.assign({},opt||{},{signal:c.signal})).finally(function(){clearTimeout(t);});}
async function cargarProyectos(){
  try{
    var r=await fetchT(SB_URL+'/rest/v1/scrum_state?id=eq.'+SB_ID+'&select=state_json,updated_at',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var rows=await r.json();
    ST=(rows[0]&&rows[0].state_json)||{projects:[],tickets:[],sprints:[]};
    SRC.proj='ok'; SRC.projFecha=(rows[0]&&rows[0].updated_at)||new Date().toISOString();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({st:ST,fecha:SRC.projFecha}));}catch(e){}
  }catch(e){
    SRC.projErr=(e&&e.name==='AbortError')?'tiempo de espera agotado':(e.message||String(e));
    var c=null;try{c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(_){}
    if(c&&c.st){ST=c.st;SRC.proj='cache';SRC.projFecha=c.fecha;}
    else{ST={projects:[],tickets:[],sprints:[]};SRC.proj='fail';}
  }
}
async function cargarHelpdesk(){
  var urls=['helpdesk.json?_='+Date.now(),'https://raw.githubusercontent.com/kellclau/pionier/main/helpdesk.json?_='+Date.now()];
  for(var i=0;i<urls.length;i++){
    try{var r=await fetchT(urls[i]);if(!r.ok)throw new Error('HTTP '+r.status);HD=await r.json();SRC.hd='ok';return;}catch(e){}
  }
  HD=null;SRC.hd='fail';
}
async function cargar(){
  document.getElementById('app').innerHTML='<div class="state">Cargando datos…</div>';
  await Promise.all([cargarProyectos(),cargarHelpdesk()]);

  var hdFecha=(HD&&HD.generado)||'';

  var meses=tend.length||1;
  var promMes=tend.length?Math.round(tend.reduce(function(a,t){return a+(t.Creados||0);},0)/meses):0;
  // último mes parcial si el corte cae en ese mes y antes del día 28
  var parcial=false;
  if(tend.length&&hdFecha){var g=parseD(hdFecha),u=tend[tend.length-1];if(g&&u.Anio===g.getFullYear()&&u.Mes===g.getMonth()+1&&g.getDate()<28)parcial=true;}
  var top2=resp.slice(0,2),top2Sum=top2.reduce(function(a,r){return a+r.TotalTickets;},0),top2Pct=pct(top2Sum,tTotal);
  var lenta=areasT.filter(function(a){return a.TotalTickets>=20;}).sort(function(a,b){return (b.PromHorasResolucion||0)-(a.PromHorasResolucion||0);})[0]||null;
  var rapida=areasT.filter(function(a){return a.TotalTickets>=20;}).sort(function(a,b){return (a.PromHorasResolucion||0)-(b.PromHorasResolucion||0);})[0]||null;
  var tipos=grp((HD&&HD.tickets)||[],function(t){return normSubtipo(t.subtipo);});
  var tiposTot=tipos.reduce(function(a,t){return a+t.val;},0);
  var top3TiposPct=pct(tipos.slice(0,3).reduce(function(a,t){return a+t.val;},0),tiposTot);
  var altaCrit=prio.filter(function(p){return /cr[ií]tica|alta/i.test(p.NO_PRIORITY);}).reduce(function(a,p){return a+p.TotalTickets;},0);

      +'<div class="kpi'+((enRiesgo.length+espera.length)?' hl':'')+'"><div class="l">Requieren atención</div><div class="v">'+(enRiesgo.length+espera.length)+'</div><div class="s">'+enRiesgo.length+' vencidos · '+espera.length+' en espera</div></div>')
    +'</div>'
    +'<div class="meta"><span><span class="dot" style="background:'+(SRC.hd==='ok'?'#15803D':'#C2410C')+'"></span>Tickets al <b>'+fechaLarga(hdFecha)+'</b></span>'

  /* ----- CAPÍTULO 1: operación ----- */
  var ultimoComp=tend.length?(parcial&&tend.length>1?tend[tend.length-2]:tend[tend.length-1]):null;

      data:{labels:lbl,datasets:[
        {label:'Creados',data:tend.map(function(t){return t.Creados;}),backgroundColor:'#D9D4C6',borderRadius:6,maxBarThickness:46},
        {label:'Cerrados',data:tend.map(function(t){return t.Cerrados;}),backgroundColor:'#F5C400',borderRadius:6,maxBarThickness:46}
      ]},
      options:{maintainAspectRatio:false,animation:false,plugins:{legend:{position:'bottom',labels:{color:'#6E6A60',boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{afterBody:function(items){var t=tend[items[0].dataIndex];return 'Resolución: '+Math.round(t.PctResolucion||pct(t.Cerrados,t.Creados))+'%'+(parcial&&items[0].dataIndex===tend.length-1?' (mes en curso)':'');}}}},
        scales:{x:{grid:{display:false},ticks:{color:'#6E6A60'}},y:{grid:{color:'#F0EDE3'},ticks:{color:'#6E6A60',precision:0}}}}});
  }
}

/* ================= detalles (modales) ================= */
function modal(t,s,b){document.getElementById('modal').innerHTML='<div class="modal-h"><div><div class="t">'+t+'</div><div class="s">'+s+'</div></div><button class="x" onclick="closeM()" aria-label="Cerrar">✕</button></div><div class="modal-b">'+b+'</div>';document.getElementById('ov').classList.add('show');}
function closeM(){document.getElementById('ov').classList.remove('show');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM();});
var COLC={'Backlog':'#9A968C','En progreso':'#1D4ED8','En revisión':'#6D4FB3','Hecho':'#15803D'};
function estTicketCol(e){return {'Cerrado':'#15803D','Rechazado':'#C2410C','Cancelado':'#9A968C','Asignado':'#1D4ED8','En desarrollo':'#1D4ED8','En proceso':'#1D4ED8','Pendiente Aprobación':'#B08900','Pausado':'#6D4FB3'}[e]||'#6E6A60';}
function openProj(pid){
  var p=(ST.projects||[]).find(function(x){return x.id===pid;});if(!p)return;
  var ts=ticketsOf(pid),venc=vencidas(pid).map(function(t){return t.id||t.title;});
  var resumen=['Backlog','En progreso','En revisión','Hecho'].map(function(c){return c+': <b>'+ts.filter(function(t){return t.col===c;}).length+'</b>';}).join(' · ');
  var rows=ts.map(function(t){var cc=COLC[t.col]||'#9A968C';var d=taskDates(t);var v=venc.indexOf(t.id||t.title)>=0;
    return '<tr><td style="font-weight:600">'+esc(t.title||'—')+(v?' '+tag('vencida','#C2410C'):'')+'</td><td>'+esc(mName(t.assignee||t.responsable))+'</td><td class="c">'+tag(t.col||'—',cc)+'</td><td class="c" style="white-space:nowrap">'+(d.end?fechaLarga(d.end):'—')+'</td></tr>';}).join('');
  modal(esc(p.name),empTag(p.empresa)+' · '+progress(pid)+'% completado · '+ts.length+' tareas'+(p.area?' · '+esc(cap(p.area)):''),
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">'+resumen+'</div><table class="ctab"><thead><tr><th>Tarea</th><th>Responsable</th><th class="c">Estado</th><th class="c">Fecha fin</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">Sin tareas registradas</td></tr>')+'</tbody></table>');
}
function listaProyHTML(ps,extra){return ps.length?ps.map(function(p){var c=estadoCat(p);return '<div class="pitem" onclick="openProj(\''+js(p.id)+'\')">'+empTag(p.empresa)+'<span class="nm">'+esc(p.name)+'</span><span class="ar">'+(extra?extra(p):esc(cap(p.area||'')))+'</span>'+mini(progress(p.id),ECOL[c])+'</div>';}).join(''):'<div style="color:var(--muted);padding:12px 0">Sin proyectos.</div>';}
function openLista(cat){var ps=projsFiltrados().filter(function(p){return estadoCat(p)===cat;}).sort(function(a,b){return progress(b.id)-progress(a.id);});modal(esc(cat),ps.length+' proyecto'+(ps.length===1?'':'s')+' · '+EDESC[cat],'<div class="plist">'+listaProyHTML(ps)+'</div>');}
function openRiesgo(){var ps=projsFiltrados().filter(function(p){return estadoCat(p)!=='Completado'&&vencidas(p.id).length;}).sort(function(a,b){return vencidas(b.id).length-vencidas(a.id).length;});modal('Proyectos con tareas vencidas',ps.length+' proyecto'+(ps.length===1?'':'s'),'<div class="plist">'+listaProyHTML(ps,function(p){var n=vencidas(p.id).length;return '<b style="color:#C2410C">'+n+' vencida'+(n>1?'s':'')+'</b>';})+'</div>');}
function openPersona(cod){
  var pn={};(ST.projects||[]).forEach(function(p){pn[p.id]=p.name;});
  var ts=(ST.tickets||[]).filter(function(t){return (t.assignee||t.responsable)===cod&&t.col!=='Hecho';});
  var rows=ts.map(function(t){return '<tr><td style="font-weight:600">'+esc(t.title||'—')+'</td><td>'+esc(pn[t.projId]||'—')+'</td><td class="c">'+tag(t.col||'—',COLC[t.col]||'#9A968C')+'</td></tr>';}).join('');
  modal(esc(mName(cod)),ts.length+' tarea'+(ts.length===1?'':'s')+' abiertas en proyectos',ts.length?'<table class="ctab"><thead><tr><th>Tarea</th><th>Proyecto</th><th class="c">Estado</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div style="color:var(--muted)">Sin tareas abiertas.</div>');
}
function tablaTickets(lista,colSol){
  lista=lista.slice().sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
  return '<table class="ctab"><thead><tr><th>Ticket</th><th>Título</th><th>'+(colSol?'Solicitante':'Área')+'</th><th class="c">Estado</th><th class="c">Fecha</th></tr></thead><tbody>'
    +lista.map(function(t){return '<tr><td style="white-space:nowrap;font-weight:600">'+esc(t.ticket)+'</td><td>'+esc(t.titulo||'—')+'</td><td>'+esc(cap(colSol?t.solicitante:t.area)||'—')+'</td><td class="c">'+tag(t.estado||'—',estTicketCol(t.estado))+'</td><td class="c" style="white-space:nowrap">'+fechaLarga(t.fecha)+'</td></tr>';}).join('')+'</tbody></table>';
}
function openResp(nombre){
  var all=(HD&&HD.tickets)||[];
  var lista=all.filter(function(t){return (t.responsable||'').toUpperCase()===(nombre||'').toUpperCase();});
  modal(esc(cap(nombre)),lista.length+' ticket'+(lista.length===1?'':'s')+' en el detalle',lista.length?tablaTickets(lista,true):'<div style="color:var(--muted)">El detalle por ticket no trae responsable para esta persona.</div>');
}
function openTipo(sub){var lista=((HD&&HD.tickets)||[]).filter(function(t){return normSubtipo(t.subtipo)===sub;});modal(esc(sub),lista.length+' ticket'+(lista.length===1?'':'s')+' de este tipo',tablaTickets(lista,true));}

/* ================= acceso ================= */
function doLogin(){if(document.getElementById('pass').value===DASH_PASS){try{sessionStorage.setItem('ti_auth','1');}catch(e){}entrar();}else{document.getElementById('loginErr').textContent='Contraseña incorrecta';document.getElementById('pass').value='';}}
function entrar(){document.getElementById('login').style.display='none';cargar();}
(function(){var ok=false;try{ok=sessionStorage.getItem('ti_auth')==='1';}catch(e){}if(ok)entrar();else setTimeout(function(){var p=document.getElementById('pass');if(p)p.focus();},100);})();
</script>
